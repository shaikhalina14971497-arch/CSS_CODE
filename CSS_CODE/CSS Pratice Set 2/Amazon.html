<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Navigation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a class="amazon-link" href="https://www.amazon.com/">
            <img src="Amazon Logo.jpg" alt="Amazon.in">
        </a>

        <a href="#">Account</a>
        <a href="#">My Cart</a>
        <a href="#">Contact Us</a>

        <form class="search-form" action="#" method="get">
            <input type="search" name="search" placeholder="Search Amazon.in" aria-label="Search Amazon.in">
            <button type="submit">Search</button>
        </form>
    </nav>
</body>
</html>
